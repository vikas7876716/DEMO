<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@200;300;400;600;700;800;900&family=Noto+Serif+Display:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <div class="main">
        <div class="box">
        </div>
        <nav class="navbar">
            <span><img width="60" src="assets/logo.svg" alt="Netflix Logo"></span>
            <div class="buttons">
                <button>English</button>
                <button class="sign-in">Sign in</button>
            </div>
        </nav>
        <div class="hero">
            <span class="font">Unlimited movies, TV</span>
            <span class="font">shows and more</span>
            <span>Starts at ₹149. Cancel at any time.</span>
            <span>Ready to watch? Enter your email to create or restart your membership.</span>
            <div class="input">
<input type="email" placeholder="Email address">
<button>Get Started</button>
            </div>
        </div>

        
    </div>


</body>

</html>
